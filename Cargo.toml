[workspace]
members = ["xtask"]

[package]
name = "bevy_av1"
description = "AV1 video decoder for Bevy"
version = "0.3.0"
edition = "2024"
keywords = ["bevy", "video", "av1"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rectalogic/bevy_av1"

[features]
default = ["rav1d"]
dav1d = ["dep:dav1d"]
rav1d = ["dep:rav1d"]

[dependencies]
async-channel = "2.5.0"
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_log",
] }
bitstream-io = "4.9.0"
dav1d = { version = "0.11.0", optional = true }
rav1d = { path = "../experiments/vendor/rav1d", optional = true }
mp4 = "0.14.0"
yuv = "0.8.11"

[dev-dependencies]
bevy = { version = "0.18", features = ["https"] }
rand = "0.9.2"

[[example]]
name = "demo3d"
path = "examples/demo3d.rs"
doc-scrape-examples = true

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
